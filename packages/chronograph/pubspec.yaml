name: chronograph
description: "Lightweight reactive stopwatch/countdown for Flutter. ChronoGraph provides ValueListenable for stopwatch, timer, and DateTime countdown, plus a tiny ChronoView."
version: 1.0.2
homepage: https://davigmacode.github.io/flutter_chronograph
repository: https://github.com/davigmacode/flutter_chronograph

topics:
  - chronograph
  - countdown
  - stopwatch
  - timer

funding:
 - https://buymeacoffee.com/davigmacode
 - https://ko-fi.com/davigmacode

environment:
  sdk: ^3.8.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

