name: widgetarian
description: The unified Flutter UI toolkit and umbrella package bringing together animations, choices, typography, layout, tiles, and responsive utilities.
version: 1.0.0
homepage: https://github.com/davigmacode/flutter_wx
repository: https://github.com/davigmacode/flutter_wx/tree/main/packages/widgetarian
issue_tracker: https://github.com/davigmacode/flutter_wx/issues

topics:
  - ui
  - toolkit
  - widgets
  - animation
  - widgetarian

funding:
  - https://buymeacoffee.com/davigmacode
  - https://ko-fi.com/davigmacode

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  animated_checkmark: ^3.1.0
  animated_icon_theme: ^1.0.4
  animated_repeatable: ^1.2.0
  animated_switcher_transitions: ^1.0.0
  animated_transform: ^1.0.6
  choice: ^2.3.3
  chronograph: ^1.0.2
  disclosure: ^2.2.0
  fancy_border: ^0.0.3
  lerp: ^0.0.2
  marquee_transition: ^0.1.0
  overlap_stack: ^1.0.1
  theme_patrol: ^3.2.3
  wheel_choice: ^1.3.0
  wheel_choice_ext: ^0.1.0
  wx_avatar: ^3.1.0
  wx_badge: ^3.0.0
  wx_box: ^4.2.1
  wx_divider: ^1.0.0
  wx_layout: ^1.0.0
  wx_spoiler: ^1.0.0
  wx_text: ^4.0.0
  wx_text_animated: ^1.0.0
  wx_tile: ^2.0.0
  wx_utils: ^0.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
